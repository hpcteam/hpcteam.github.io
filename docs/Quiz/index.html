<html lang="en">
<head>
<meta charset="UTF-8">

    font-size: 16px;

    border-radius: 10px;

    margin-bottom: 14px;

    border: none;
    padding: 12px 20px;
    font-size: 16px;
    border-radius: 10px;
    cursor: pointer;
    width: 100%;
    font-weight: 600;

  .secondary-btn { background: #eee; color: #333; margin-top: 10px; }

  .error { color: #e03131; font-size: 14px; margin-top: -10px; margin-bottom: 10px; }

  .topic-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
    margin-top: 20px;
  }
  .topic-box {
    padding: 22px 12px;
    border-radius: 12px;

    font-weight: 700;
    text-align: center;
    cursor: pointer;
    transition: transform 0.15s;
    font-size: 15px;

  }

  .m1 { background: #1e3c72; }
  .m2 { background: #2a5298; }

  .question-block {

    border-radius: 10px;
    border: 2px solid transparent;
  }

    padding: 8px 10px;
    border-radius: 6px;
    cursor: pointer;
    margin-bottom: 4px;
  }
  .options label:hover { background: #e8f2ff; }
  .options input { margin-right: 8px; }
  .question-block.correct { border-color: #2f9e44; background: #edfbee; }
  .question-block.wrong { border-color: #e03131; background: #fff0f0; }
  .qfeedback { font-size: 13px; margin-top: 6px; font-weight: 600; }
  .qfeedback.ok { color: #2f9e44; }
  .qfeedback.bad { color: #e03131; }

  .progress-bar {
    height: 8px;
    background: #eee;
    border-radius: 4px;
    margin-bottom: 18px;

/* ======================= STORAGE (localStorage-backed) ======================= */
function storageSet(key, value) {
  try { localStorage.setItem(key, value); return true; }
  catch (e) { console.error("localStorage set failed", e); return false; }
}
function storageGet(key) {
  try {
    const v = localStorage.getItem(key);
    return v === null ? null : { value: v };
  } catch (e) { console.error("localStorage get failed", e); return null; }
}
function storageList(prefix) {
  try {
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(prefix)) keys.push(k);
    }
    keys.sort();
    return { keys };
  } catch (e) { console.error("localStorage list failed", e); return { keys: [] }; }
}

/* ======================= NAME ======================= */
function renderName() {

  `;

}

function submitName() {
  const val = document.getElementById("nameInput").value.trim();
  if (!val) {
    document.getElementById("nameError").style.display = "block";
    return;
  }
  state.name = val;
  storageSet("quiz:lastName", val);
  goTo("topics");
}

      `).join("")}
    </div>

}

function selectTopic(key) {
  const topic = TOPICS.find(t => t.key === key);
  state.topic = topic;
  if (!topic.ready) {

    return;
  }
  goTo("mode");
}

      </div>
      <div class="mode-box m2" onclick="startQuiz('text')">
        <h3>Type Answer</h3>
        <p>Same question bank — type the command yourself.</p>
      </div>
    </div>
    <button class="secondary-btn" style="margin-top:20px;" onclick="goTo('topics')">Back to Sections</button>
  `;
}

function startQuiz(mode) {
  state.mode = mode;
  state.setIndex = 0;
  state.setScores = [];
  state.currentAnswers = new Array(SET_SIZE).fill(null);
  state.showSetReview = false;
  state.showFinalReview = false;
  goTo("quiz");
}

/* ======================= QUIZ (per set) ======================= */
function currentRunningTotal() {
  return state.setScores.reduce((sum, s) => sum + s.correct, 0);
}
function currentRunningTotalPossible() {
  return state.setScores.reduce((sum, s) => sum + s.total, 0);
}
function allWrongAnswers() {
  return state.setScores.reduce((acc, s) => acc.concat(s.wrongAnswers), []);
}

function renderQuiz() {
  const set = LINUX_SETS[state.setIndex];
  const pct = Math.round((state.setIndex / LINUX_SETS.length) * 100);
  const modeLabel = state.mode === "mcq" ? "Multiple Choice" : "Type Answer";

  let questionsHtml = "";
  set.forEach((q, i) => {
    if (state.mode === "mcq") {
      questionsHtml += `
        <div class="question-block" id="qblock-${i}">
          <p class="qtext">${state.setIndex * SET_SIZE + i + 1}. ${escapeHtml(q.q)}</p>
          <div class="options">
            ${q.options.map((opt, oi) => `
              <label><input type="radio" name="opt${i}" value="${oi}" onchange="selectMcq(${i}, ${oi})"> ${escapeHtml(opt)}</label>
            `).join("")}
          </div>
        </div>
      `;
    } else {
      questionsHtml += `
        <div class="question-block" id="qblock-${i}">
          <p class="qtext">${state.setIndex * SET_SIZE + i + 1}. ${escapeHtml(q.q)}</p>
          <input type="text" class="type-input" id="typeinput-${i}" placeholder="Type your answer"
                 oninput="selectTyped(${i}, this.value)" autocomplete="off" />
        </div>
      `;
    }
  });

  app.innerHTML = `
    <div class="breadcrumb">${escapeHtml(state.name)} · ${escapeHtml(state.topic.name)} · ${modeLabel}</div>
    <h2>Set ${state.setIndex + 1} of ${LINUX_SETS.length}</h2>
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    ${state.setIndex > 0 ? `<div class="total-banner"><span>Running total</span><b>${currentRunningTotal()} / ${currentRunningTotalPossible()}</b></div>` : ""}
    ${questionsHtml}
    <button id="submitSetBtn" onclick="submitSet()" ${allAnswered() ? "" : "disabled"}>Submit Set</button>
  `;
}

function allAnswered() {
  return state.currentAnswers.every(a => a !== null && a !== "");
}

function selectMcq(i, val) {
  state.currentAnswers[i] = val;
  document.getElementById("submitSetBtn").disabled = !allAnswered();
}
function selectTyped(i, val) {
  state.currentAnswers[i] = val;
  document.getElementById("submitSetBtn").disabled = !allAnswered();
}

function normalize(s) {
  return String(s).trim().toLowerCase();
}

function submitSet() {
  const set = LINUX_SETS[state.setIndex];
  let correct = 0;
  const wrongAnswers = [];

  set.forEach((q, i) => {
    const block = document.getElementById("qblock-" + i);
    let isCorrect = false;
    let yourAnswerText = "";
    const correctAnswerText = q.options[q.answer];

    if (state.mode === "mcq") {
      const chosenIndex = Number(state.currentAnswers[i]);
      isCorrect = chosenIndex === q.answer;
      yourAnswerText = q.options[chosenIndex];
      block.querySelectorAll("input").forEach(inp => inp.disabled = true);
    } else {
      const typedRaw = state.currentAnswers[i];
      const typed = normalize(typedRaw);
      const correctNorm = normalize(correctAnswerText);
      isCorrect = typed === correctNorm;
      yourAnswerText = typedRaw;
      const inputEl = document.getElementById("typeinput-" + i);
      inputEl.disabled = true;
      inputEl.classList.add(isCorrect ? "correct-input" : "wrong-input");
      const fb = document.createElement("div");
      fb.className = "qfeedback " + (isCorrect ? "ok" : "bad");
      fb.textContent = isCorrect ? "Correct!" : "Correct answer: " + correctAnswerText;
      inputEl.insertAdjacentElement("afterend", fb);
    }
    block.classList.add(isCorrect ? "correct" : "wrong");
    if (isCorrect) {
      correct++;
    } else {
      wrongAnswers.push({
        questionNumber: state.setIndex * SET_SIZE + i + 1,
        question: q.q,
        yourAnswer: yourAnswerText || "(no answer)",
        correctAnswer: correctAnswerText
      });
    }
  });

  const setResult = { correct, total: set.length, setNumber: state.setIndex + 1, wrongAnswers };
  state.setScores.push(setResult);

  // Save this set's result immediately (wrong answers included)
  const setKey = "quiz:setresult:" + Date.now();
  storageSet(setKey, JSON.stringify({
    name: state.name,
    topic: state.topic.name,
    mode: state.mode,
    ...setResult,
    date: new Date().toISOString()
  }));

  state.showSetReview = false;
  document.getElementById("submitSetBtn").style.display = "none";
  goTo("setResult");
}

/* ======================= SET RESULT (between sets) ======================= */
function renderSetResult() {
  const last = state.setScores[state.setScores.length - 1];
  const isLastSet = state.setIndex === LINUX_SETS.length - 1;

  app.innerHTML = `
    <div class="breadcrumb">${escapeHtml(state.name)} · ${escapeHtml(state.topic.name)}</div>
    <h1>Set ${last.setNumber} complete!</h1>
    <div class="score-display">${last.correct} / ${last.total}</div>
    <div class="total-banner">
      <span>Running total</span>
      <b>${currentRunningTotal()} / ${currentRunningTotalPossible()}</b>
    </div>
    ${last.wrongAnswers.length > 0 ? `
      <button class="review-toggle" onclick="toggleSetReview()">
        ${state.showSetReview ? "Hide" : "Show"} ${last.wrongAnswers.length} wrong answer${last.wrongAnswers.length === 1 ? "" : "s"} from this set
      </button>
      <div class="review-section" id="setReviewSection" style="display:${state.showSetReview ? "block" : "none"};">
        ${renderReviewItems(last.wrongAnswers)}
      </div>
    ` : `<p class="review-empty">🎉 Perfect set — no wrong answers!</p>`}
    <button onclick="continueAfterSet()" style="margin-top:16px;">${isLastSet ? "See Final Results" : "Continue to Next Set"}</button>
  `;
}

function toggleSetReview() {
  state.showSetReview = !state.showSetReview;
  renderSetResult();
}

function renderReviewItems(items) {
  return items.map(w => `
    <div class="review-item">
      <p class="rq">${w.questionNumber}. ${escapeHtml(w.question)}</p>
      <p class="ryour">Your answer: ${escapeHtml(w.yourAnswer)}</p>
      <p class="rcorrect">Correct answer: ${escapeHtml(w.correctAnswer)}</p>
    </div>
  `).join("");
}

function continueAfterSet() {
  if (state.setIndex === LINUX_SETS.length - 1) {
    finishQuiz();
  } else {
    state.setIndex++;
    state.currentAnswers = new Array(SET_SIZE).fill(null);
    goTo("quiz");
  }
}

/* ======================= FINAL RESULT ======================= */
function finishQuiz() {
  const totalCorrect = currentRunningTotal();
  const totalPossible = currentRunningTotalPossible();
  const wrongAnswers = allWrongAnswers();
  const record = {
    name: state.name,
    topic: state.topic.name,
    mode: state.mode,
    totalCorrect,
    totalPossible,
    setScores: state.setScores,
    wrongAnswers,
    date: new Date().toISOString()
  };
  const finalKey = "quiz:finalresult:" + Date.now();
  storageSet(finalKey, JSON.stringify(record));
  state.showFinalReview = false;
  goTo("finalResult");
}

function renderFinalResult() {
  const totalCorrect = currentRunningTotal();
  const totalPossible = currentRunningTotalPossible();
  const pct = Math.round((totalCorrect / totalPossible) * 100);
  const wrongAnswers = allWrongAnswers();

  app.innerHTML = `
    <div class="breadcrumb">${escapeHtml(state.name)} · ${escapeHtml(state.topic.name)}</div>
    <h1>🎉 Quiz Complete!</h1>
    <div class="score-display">${totalCorrect} / ${totalPossible}</div>
    <p class="sub" style="text-align:center;">${pct}% correct overall</p>
    <div class="set-history">
      <p class="sub" style="margin-bottom:6px;">Set-by-set breakdown</p>
      ${state.setScores.map(s => `
        <div class="set-row"><span>Set ${s.setNumber}</span><span>${s.correct} / ${s.total}</span></div>
      `).join("")}
    </div>
    ${wrongAnswers.length > 0 ? `
      <button class="review-toggle" onclick="toggleFinalReview()">
        ${state.showFinalReview ? "Hide" : "Show"} all ${wrongAnswers.length} wrong answer${wrongAnswers.length === 1 ? "" : "s"}
      </button>
      <div class="review-section" id="finalReviewSection" style="display:${state.showFinalReview ? "block" : "none"};">
        ${renderReviewItems(wrongAnswers)}
      </div>
    ` : `<p class="review-empty">🏆 Perfect run — no wrong answers at all!</p>`}
    <button onclick="goTo('mode')" style="margin-top:20px;">Try Another Mode</button>
    <button class="secondary-btn" onclick="goTo('topics')">Back to Sections</button>
    <div class="set-history" id="pastResultsSection">
      <p class="sub">Loading your past results...</p>
    </div>
  `;
  loadPastResults();
}

function toggleFinalReview() {
  state.showFinalReview = !state.showFinalReview;
  renderFinalResult();
}

function loadPastResults() {
  const list = storageList("quiz:finalresult:");
  if (!list.keys.length) {
    document.getElementById("pastResultsSection").innerHTML = "";
    return;
  }
  const keys = list.keys.slice(-5).reverse();
  const records = [];
  for (const k of keys) {
    const res = storageGet(k);
    if (res) {
      try { records.push(JSON.parse(res.value)); } catch (e) { /* skip malformed */ }
    }
  }
  if (!records.length) {
    document.getElementById("pastResultsSection").innerHTML = "";
    return;
  }
  document.getElementById("pastResultsSection").innerHTML =
    `<p class="sub" style="margin-bottom:6px;">Your recent full attempts</p>` +
    records.map(r => `
      <div class="set-row">
        <span>${escapeHtml(r.topic)} (${escapeHtml(r.mode)})</span>
        <span>${r.totalCorrect} / ${r.totalPossible}</span>
      </div>
    `).join("");
}

/* ======================= UTIL ======================= */
function goTo(screen) {
  state.screen = screen;
  render();
}
function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = String(str);
  return div.innerHTML;
}
function escapeAttr(str) {
  return escapeHtml(str);
}

/* ======================= INIT ======================= */
(function init() {
  const res = storageGet("quiz:lastName");
  if (res && res.value) state.name = res.value;
  render();
})();
</script>
</body>
